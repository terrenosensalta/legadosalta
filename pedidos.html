<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pedidos — Legado de Salta</title>
  <meta name="theme-color" content="#1e1612" />
  <link rel="icon" type="image/png" href="assets/logo-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: #faf8f5;
      --card: #ffffff;
      --sand: #f4efe8;
      --espresso: #1e1612;
      --espresso-mid: #4a3528;
      --text: #5c4b40;
      --muted: #928276;
      --gold: #9e7b4f;
      --border: rgba(74, 53, 40, 0.12);
      --border-strong: rgba(74, 53, 40, 0.28);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      --st-nuevo: #9e7b4f;
      --st-confirmado: #4a6b8a;
      --st-pagado: #4f7a52;
      --st-enviado: #6b5a8a;
      --st-entregado: #2f5d3a;
      --st-cancelado: #a2483a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--espresso);
      font-family: var(--font-sans);
      font-size: 13px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ---------- Encabezado ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .brand-title { font-family: var(--font-serif); font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1; }
    .brand-sub { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-top: 3px; }

    .mode-pill {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--sand);
      color: var(--espresso-mid);
      white-space: nowrap;
    }

    .mode-pill.live { background: #e7f1e8; color: #2f5d3a; }

    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    .updated { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #fff;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s var(--ease);
    }

    .btn:active { transform: scale(0.96); }
    .btn-dark { background: var(--espresso); border-color: var(--espresso); color: #fff; }

    @media (hover: hover) {
      .btn:hover { border-color: var(--espresso); }
      .btn-dark:hover { background: var(--espresso-mid); }
    }

    .btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Contenido ---------- */
    main { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; }

    .notice {
      background: var(--sand);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 20px;
    }

    .notice strong { color: var(--espresso); }
    .notice.error { background: #fbeeeb; border-color: rgba(162, 72, 58, 0.3); color: #7d3326; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .kpi-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .kpi-value { font-family: var(--font-serif); font-size: 32px; font-weight: 600; line-height: 1.1; margin-top: 6px; font-variant-numeric: lining-nums tabular-nums; }
    .kpi-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search {
      flex: 1 1 240px;
      min-width: 0;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      font-size: 16px;
      outline: none;
    }

    .search:focus { border-color: var(--gold); }

    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .chip .n { color: var(--muted); margin-left: 3px; }
    .chip.active { background: var(--espresso); border-color: var(--espresso); color: #fff; }
    .chip.active .n { color: rgba(255, 255, 255, 0.7); }

    /* ---------- Tarjetas de pedido ---------- */
    .orders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .order {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--st, var(--gold));
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: cardIn 0.45s var(--ease) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .order-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .order-code { font-weight: 600; letter-spacing: 0.08em; font-size: 12px; }
    .order-date { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .status-pill {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--st, var(--gold));
      white-space: nowrap;
    }

    .order-name { font-family: var(--font-serif); font-size: 22px; font-weight: 600; line-height: 1.1; }
    .order-dest { font-size: 12px; color: var(--text); margin-top: 3px; }

    .order-items {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .order-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11.5px; }
    .order-meta dt { color: var(--muted); }
    .order-meta dd { color: var(--espresso); }

    .order-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .order-total span:first-child { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .order-total strong { font-family: var(--font-serif); font-size: 26px; font-variant-numeric: lining-nums tabular-nums; }

    .order-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .status-select {
      flex: 1 1 150px;
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .internal-note {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }

    .internal-note:focus { border-style: solid; border-color: var(--gold); }

    .saving { opacity: 0.55; pointer-events: none; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty p:first-child { font-family: var(--font-serif); font-size: 24px; color: var(--espresso); margin-bottom: 6px; }

    /* ---------- Ingreso ---------- */
    .login {
      max-width: 380px;
      margin: 12vh auto 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(30, 22, 18, 0.06);
    }

    .login img { width: 64px; height: 64px; object-fit: contain; }
    .login h1 { font-family: var(--font-serif); font-size: 28px; font-weight: 600; margin: 8px 0 4px; }
    .login p { color: var(--text); font-size: 12px; line-height: 1.6; margin-bottom: 18px; }
    .login form { display: flex; flex-direction: column; gap: 10px; }
    .login input { padding: 12px 16px; border: 1px solid var(--border-strong); border-radius: 12px; font-size: 16px; outline: none; text-align: center; }
    .login input:focus { border-color: var(--gold); }
    .login .btn { justify-content: center; padding: 13px; }
    .login-error { color: #a2483a; font-size: 12px; min-height: 16px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translate(-50%, 16px);
      background: var(--espresso);
      color: #fff;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.35s var(--ease);
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .topbar-inner { padding: 10px 14px; gap: 10px; }
      .brand img { width: 34px; height: 34px; }
      .brand-title { font-size: 17px; }
      .mode-pill { font-size: 8.5px; padding: 4px 8px; }
      .updated { display: none; }
      .btn-label { display: none; }
      main { padding: 16px 14px 48px; }
      .kpi { padding: 12px 14px; }
      .kpi-value { font-size: 26px; }
      .orders { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Ingreso con clave (solo cuando hay planilla conectada) -->
  <section class="login" id="loginView" hidden>
    <img src="assets/logo-transparent.png" alt="Legado de Salta" />
    <h1>Panel de pedidos</h1>
    <p>Ingresá la clave que configuraste en la planilla de Google.</p>
    <form id="loginForm">
      <input type="password" id="loginKey" placeholder="Clave del panel" autocomplete="current-password" required />
      <button class="btn btn-dark" type="submit">Entrar</button>
      <div class="login-error" id="loginError" role="alert"></div>
    </form>
  </section>

  <div id="appView" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="index.html" title="Ir a la tienda">
          <img src="assets/logo-transparent.png" alt="" />
          <div>
            <div class="brand-title">Pedidos</div>
            <div class="brand-sub">Legado de Salta</div>
          </div>
        </a>
        <span class="mode-pill" id="modePill">Modo prueba</span>
        <div class="topbar-actions">
          <span class="updated" id="updatedAt"></span>
          <button class="btn" id="refreshBtn" type="button" aria-label="Actualizar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            <span class="btn-label">Actualizar</span>
          </button>
          <button class="btn" id="logoutBtn" type="button" hidden>Salir</button>
        </div>
      </div>
    </header>

    <main>
      <div class="notice" id="notice" hidden></div>

      <section class="kpis" aria-label="Resumen">
        <div class="kpi">
          <div class="kpi-label">Nuevos</div>
          <div class="kpi-value" id="kpiNuevos">0</div>
          <div class="kpi-hint">Para responder</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">En curso</div>
          <div class="kpi-value" id="kpiCurso">0</div>
          <div class="kpi-hint">Confirmados y pagados</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Enviados</div>
          <div class="kpi-value" id="kpiEnviados">0</div>
          <div class="kpi-hint">Enviados y entregados</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Vendido (pagados)</div>
          <div class="kpi-value" id="kpiVendido">$0</div>
          <div class="kpi-hint" id="kpiVendidoHint">Pagados, enviados y entregados</div>
        </div>
      </section>

      <div class="toolbar">
        <input type="search" class="search" id="searchInput" placeholder="Buscar por nombre, código o destino…" aria-label="Buscar pedidos" />
        <div class="chips" id="statusChips" role="tablist" aria-label="Filtrar por estado"></div>
      </div>

      <section class="orders" id="ordersList" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script>
    const CONFIG = window.LEGADO_CONFIG || {};
    const ENDPOINT = CONFIG.pedidosUrl || '';
    const LIVE = Boolean(ENDPOINT);
    const KEY_STORAGE = 'legado-panel-clave';
    const LOCAL_ORDERS_KEY = 'legado-salta-pedidos';
    const ESTADOS = ['Nuevo', 'Confirmado', 'Pagado', 'Enviado', 'Entregado', 'Cancelado'];
    const VENDIDO = ['Pagado', 'Enviado', 'Entregado'];
    const REFRESH_MS = 60000;

    const $ = (id) => document.getElementById(id);
    const formatARS = (n) => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
    const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const statusVar = (estado) => `var(--st-${String(estado || 'nuevo').toLowerCase()})`;

    let orders = [];
    let filter = 'Todos';
    let query = '';
    let refreshTimer = null;
    let toastTimer = null;

    const storage = {
      get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch (_) { return fallback; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* sin almacenamiento */ } },
      remove(k) { try { localStorage.removeItem(k); } catch (_) { /* sin almacenamiento */ } }
    };

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    // ==================== DATOS ====================
    async function fetchOrders() {
      if (!LIVE) {
        const local = JSON.parse(storage.get(LOCAL_ORDERS_KEY, '[]') || '[]');
        return local.slice().reverse();
      }
      const clave = storage.get(KEY_STORAGE, '');
      const res = await fetch(`${ENDPOINT}?clave=${encodeURIComponent(clave)}&t=${Date.now()}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'error');
      return data.pedidos || [];
    }

    async function saveOrder(codigo, changes) {
      if (!LIVE) {
        const local = JSON.parse(storage.get(LOCAL_ORDERS_KEY, '[]') || '[]');
        const o = local.find((x) => x.codigo === codigo);
        if (o) Object.assign(o, changes);
        storage.set(LOCAL_ORDERS_KEY, JSON.stringify(local));
        return;
      }
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'actualizar', clave: storage.get(KEY_STORAGE, ''), codigo, ...changes })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'error');
    }

    async function load({ silent = false } = {}) {
      // No refrescar solo mientras se escribe una nota (se perdería lo tipeado)
      const typing = document.activeElement && document.activeElement.classList.contains('internal-note');
      if (silent && typing) return;
      const btn = $('refreshBtn');
      btn.classList.add('spinning');
      try {
        orders = await fetchOrders();
        $('updatedAt').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        hideNotice();
        if (!LIVE) showTestNotice();
        render();
      } catch (err) {
        if (err.message === 'clave') {
          logout('La clave no es correcta.');
          return;
        }
        if (!silent) showNotice('No pudimos leer la planilla. Revisá tu conexión y tocá “Actualizar”.', true);
      } finally {
        btn.classList.remove('spinning');
      }
    }

    // ==================== VISTA ====================
    function showNotice(html, isError) {
      const n = $('notice');
      n.innerHTML = html;
      n.classList.toggle('error', Boolean(isError));
      n.hidden = false;
    }

    function hideNotice() { $('notice').hidden = true; }

    function showTestNotice() {
      showNotice('<strong>Modo prueba:</strong> acá ves solo los pedidos hechos desde <em>este navegador</em>. Para recibir los pedidos de todos tus clientes, conectá la planilla de Google (ver <code>apps-script/Pedidos.gs</code>) y pegá su dirección en <code>config.js</code>.');
    }

    function matches(o) {
      if (filter !== 'Todos' && (o.estado || 'Nuevo') !== filter) return false;
      if (!query) return true;
      const hay = `${o.codigo} ${o.nombre} ${o.destino} ${o.items}`.toLowerCase();
      return hay.includes(query);
    }

    function renderKpis() {
      const count = (states) => orders.filter((o) => states.includes(o.estado || 'Nuevo')).length;
      $('kpiNuevos').textContent = count(['Nuevo']);
      $('kpiCurso').textContent = count(['Confirmado', 'Pagado']);
      $('kpiEnviados').textContent = count(['Enviado', 'Entregado']);
      const vendidos = orders.filter((o) => VENDIDO.includes(o.estado));
      $('kpiVendido').textContent = formatARS(vendidos.reduce((acc, o) => acc + (Number(o.total) || 0), 0));
      $('kpiVendidoHint').textContent = `${vendidos.length} ${vendidos.length === 1 ? 'pedido' : 'pedidos'} · en pesos`;
    }

    function renderChips() {
      const all = ['Todos', ...ESTADOS];
      $('statusChips').innerHTML = all.map((e) => {
        const n = e === 'Todos' ? orders.length : orders.filter((o) => (o.estado || 'Nuevo') === e).length;
        return `<button class="chip${e === filter ? ' active' : ''}" type="button" role="tab" aria-selected="${e === filter}" data-filter="${e}">${e}<span class="n">${n}</span></button>`;
      }).join('');
    }

    function orderCard(o) {
      const estado = o.estado || 'Nuevo';
      const options = ESTADOS.map((e) => `<option${e === estado ? ' selected' : ''}>${e}</option>`).join('');
      const descuento = Number(o.descuento) || 0;
      return `
        <article class="order" style="--st: ${statusVar(estado)}" data-codigo="${escapeHtml(o.codigo)}">
          <div class="order-head">
            <div>
              <div class="order-code">${escapeHtml(o.codigo)}</div>
              <div class="order-date">${escapeHtml(formatDate(o.fecha))}</div>
            </div>
            <span class="status-pill">${escapeHtml(estado)}</span>
          </div>
          <div>
            <div class="order-name">${escapeHtml(o.nombre || 'Sin nombre')}</div>
            <div class="order-dest">📍 ${escapeHtml(o.destino || 'Sin destino')}</div>
          </div>
          <div class="order-items">${escapeHtml(o.items)}</div>
          <dl class="order-meta">
            <dt>Pago</dt><dd>${escapeHtml(o.pago)}</dd>
            <dt>Regalo</dt><dd>${escapeHtml(o.regalo)}</dd>
            ${descuento ? `<dt>Descuento</dt><dd>−${formatARS(descuento)}</dd>` : ''}
            ${o.nota ? `<dt>Nota</dt><dd>${escapeHtml(o.nota)}</dd>` : ''}
          </dl>
          <div class="order-total"><span>Total</span><strong>${formatARS(o.total)}</strong></div>
          <div class="order-actions">
            <select class="status-select" aria-label="Estado del pedido ${escapeHtml(o.codigo)}">${options}</select>
            <button class="btn" type="button" data-copy>Copiar</button>
          </div>
          <textarea class="internal-note" rows="1" placeholder="Nota interna (seguimiento, nº de envío…)">${escapeHtml(o.notaInterna || '')}</textarea>
        </article>`;
    }

    function render() {
      renderKpis();
      renderChips();
      const list = orders.filter(matches);
      if (!list.length) {
        $('ordersList').innerHTML = `
          <div class="empty">
            <p>${orders.length ? 'No hay pedidos con ese filtro' : 'Todavía no hay pedidos'}</p>
            <p>${orders.length ? 'Probá con otro estado o búsqueda.' : 'Cuando un cliente envíe su pedido desde la tienda, aparece acá.'}</p>
          </div>`;
        return;
      }
      $('ordersList').innerHTML = list.map(orderCard).join('');
    }

    function summaryText(o) {
      return [
        `Pedido ${o.codigo} — ${o.estado || 'Nuevo'}`,
        `${o.nombre} · ${o.destino}`,
        o.items,
        `Pago: ${o.pago}`,
        `Total: ${formatARS(o.total)}`
      ].join('\n');
    }

    // ==================== EVENTOS ====================
    $('statusChips').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-filter]');
      if (!chip) return;
      filter = chip.dataset.filter;
      render();
    });

    $('searchInput').addEventListener('input', (e) => {
      query = e.target.value.trim().toLowerCase();
      render();
    });

    $('ordersList').addEventListener('change', async (e) => {
      if (!e.target.classList.contains('status-select')) return;
      const card = e.target.closest('.order');
      const codigo = card.dataset.codigo;
      const estado = e.target.value;
      card.classList.add('saving');
      try {
        await saveOrder(codigo, { estado });
        const o = orders.find((x) => x.codigo === codigo);
        if (o) o.estado = estado;
        render();
        showToast(`${codigo} → ${estado}`);
      } catch (_) {
        card.classList.remove('saving');
        showToast('No se pudo guardar. Probá de nuevo.');
        load({ silent: true });
      }
    });

    async function saveNote(textarea) {
      const codigo = textarea.closest('.order').dataset.codigo;
      const o = orders.find((x) => x.codigo === codigo);
      const notaInterna = textarea.value.trim();
      if (!o || (o.notaInterna || '') === notaInterna) return;
      try {
        await saveOrder(codigo, { notaInterna });
        o.notaInterna = notaInterna;
        showToast('Nota guardada');
      } catch (_) {
        showToast('No se pudo guardar la nota');
      }
    }

    // La nota se guarda sola al dejar de escribir o al salir del campo
    let noteTimer = null;
    $('ordersList').addEventListener('input', (e) => {
      if (!e.target.classList.contains('internal-note')) return;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => saveNote(e.target), 1200);
    });

    $('ordersList').addEventListener('focusout', (e) => {
      if (!e.target.classList.contains('internal-note')) return;
      clearTimeout(noteTimer);
      saveNote(e.target);
    });

    $('ordersList').addEventListener('click', async (e) => {
      if (!e.target.closest('[data-copy]')) return;
      const o = orders.find((x) => x.codigo === e.target.closest('.order').dataset.codigo);
      try {
        await navigator.clipboard.writeText(summaryText(o));
        showToast('Resumen copiado');
      } catch (_) {
        showToast('No se pudo copiar');
      }
    });

    $('refreshBtn').addEventListener('click', () => load());

    // Refresco automático mientras el panel está a la vista
    function startAutoRefresh() {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(() => { if (!document.hidden) load({ silent: true }); }, REFRESH_MS);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load({ silent: true }); });

    // Otra pestaña con la tienda abierta registró un pedido (modo prueba)
    window.addEventListener('storage', (e) => { if (!LIVE && e.key === LOCAL_ORDERS_KEY) load({ silent: true }); });

    // ==================== INGRESO ====================
    function showApp() {
      $('loginView').hidden = true;
      $('appView').hidden = false;
      $('modePill').textContent = LIVE ? 'Planilla conectada' : 'Modo prueba';
      $('modePill').classList.toggle('live', LIVE);
      $('logoutBtn').hidden = !LIVE;
      load();
      startAutoRefresh();
    }

    function logout(message) {
      storage.remove(KEY_STORAGE);
      clearInterval(refreshTimer);
      $('appView').hidden = true;
      $('loginView').hidden = false;
      $('loginError').textContent = message || '';
      $('loginKey').value = '';
      $('loginKey').focus();
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      storage.set(KEY_STORAGE, $('loginKey').value.trim());
      $('loginError').textContent = '';
      showApp();
    });

    $('logoutBtn').addEventListener('click', () => logout());

    if (!LIVE || storage.get(KEY_STORAGE, '')) showApp();
    else logout();
  </script>
</body>
</html>
